name: ci
# Verified on a real PR: build job + e2e job (PR-to-main only) both pass. See PR history.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobilio
          POSTGRES_PASSWORD: mobilio
          POSTGRES_DB: mobilio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # mobilio_app role, not the services: superuser — matches what apps/api actually
      # connects as (see packages/db/sql/0000_bootstrap_roles.sql).
      DATABASE_URL: postgres://mobilio_app:mobilio_app_pw@localhost:5432/mobilio
      REDIS_URL: redis://localhost:6379
      # Job-level, not step-local on "Run database migrations" — packages/db's own
      # integration tests (run later, via test:coverage) also gate on these being
      # present to decide whether to run for real against live Postgres. Scoping them
      # to just the migration step left those tests silently skipping in CI, which in
      # turn failed packages/db's coverage threshold (low coverage from skipped tests,
      # not a real regression) — found by actually watching this job run, not assumed.
      POSTGRES_BOOTSTRAP_URL: postgres://mobilio:mobilio@localhost:5432/mobilio
      MOBILIO_MIGRATOR_PASSWORD: mobilio_migrator_pw
      MOBILIO_APP_PASSWORD: mobilio_app_pw
      MIGRATOR_DATABASE_URL: postgres://mobilio_migrator:mobilio_migrator_pw@localhost:5432/mobilio
      # Same story — apps/api's auth-flow.integration.spec.ts gates on BETTER_AUTH_SECRET
      # too; without it that test (the one that actually proves magic-link sign-in,
      # rate limiting, and 404 tenant isolation over real HTTP) silently skipped here.
      BETTER_AUTH_SECRET: dev-only-not-a-real-secret-but-32-chars
      WEB_ORIGIN: http://localhost:3000
      API_BASE_URL: http://localhost:3011
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Run database migrations
        working-directory: packages/db
        run: npm run db:migrate

      - run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/config/coverage
            apps/web/coverage
            apps/api/coverage
            apps/worker/coverage
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobilio
          POSTGRES_PASSWORD: mobilio
          POSTGRES_DB: mobilio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Run database migrations
        working-directory: packages/db
        env:
          POSTGRES_BOOTSTRAP_URL: postgres://mobilio:mobilio@localhost:5432/mobilio
          MOBILIO_MIGRATOR_PASSWORD: mobilio_migrator_pw
          MOBILIO_APP_PASSWORD: mobilio_app_pw
          MIGRATOR_DATABASE_URL: postgres://mobilio_migrator:mobilio_migrator_pw@localhost:5432/mobilio
        run: npm run db:migrate

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web
        env:
          # auth.spec.ts's webServer starts a real apps/api against these — default
          # ports match this job's services: containers (CI's native 5432/6379, not
          # local dev's remapped 5433/6380 — see root .env.example for why those differ).
          E2E_API_DATABASE_URL: postgres://mobilio_app:mobilio_app_pw@localhost:5432/mobilio
          E2E_API_REDIS_URL: redis://localhost:6379
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
