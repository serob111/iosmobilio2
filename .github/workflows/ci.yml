name: ci
# Verified on a real PR: build job + e2e job (PR-to-main only) both pass. See PR history.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobilio
          POSTGRES_PASSWORD: mobilio
          POSTGRES_DB: mobilio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # No minio service here — see the "Start MinIO" step below for why.
    env:
      # Every *.integration.* spec gates on its own env vars and throws instead of
      # silently skipping when this is true (see each file's hasLive* check) — a
      # misconfigured step below (wrong var name, service not actually up) must fail
      # the job loudly, not quietly pass having run 0 integration tests.
      REQUIRE_LIVE_SERVICES: 'true'
      # mobilio_app role, not the services: superuser — matches what apps/api actually
      # connects as (see packages/db/sql/0000_bootstrap_roles.sql).
      DATABASE_URL: postgres://mobilio_app:mobilio_app_pw@localhost:5432/mobilio
      REDIS_URL: redis://localhost:6379
      # Job-level, not step-local on "Run database migrations" — packages/db's own
      # integration tests (run later, via test:coverage) also gate on these being
      # present to decide whether to run for real against live Postgres. Scoping them
      # to just the migration step left those tests silently skipping in CI, which in
      # turn failed packages/db's coverage threshold (low coverage from skipped tests,
      # not a real regression) — found by actually watching this job run, not assumed.
      POSTGRES_BOOTSTRAP_URL: postgres://mobilio:mobilio@localhost:5432/mobilio
      MOBILIO_MIGRATOR_PASSWORD: mobilio_migrator_pw
      MOBILIO_APP_PASSWORD: mobilio_app_pw
      MIGRATOR_DATABASE_URL: postgres://mobilio_migrator:mobilio_migrator_pw@localhost:5432/mobilio
      # Same story — apps/api's auth-flow.integration.spec.ts gates on BETTER_AUTH_SECRET
      # too; without it that test (the one that actually proves magic-link sign-in,
      # rate limiting, and 404 tenant isolation over real HTTP) silently skipped here.
      BETTER_AUTH_SECRET: dev-only-not-a-real-secret-but-32-chars
      WEB_ORIGIN: http://localhost:3000
      API_BASE_URL: http://localhost:3011
      # Picked up by packages/storage's and apps/api's live-MinIO integration tests —
      # same opt-in-via-env-presence pattern as the Postgres/Redis vars above.
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: mobilio
      S3_ACCESS_KEY_ID: mobilio
      S3_SECRET_ACCESS_KEY: mobilio_minio_pw
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # Run as a plain step, not a `services:` container — GitHub Actions service
      # containers have no way to pass a command to the entrypoint, and
      # cgr.dev/chainguard/minio needs `server /data ...` args to actually start the
      # server (its bare entrypoint just prints usage and exits). See
      # docker-compose.yml's minio service comment for why this image specifically, and
      # why it's pinned by digest.
      - name: Start MinIO
        run: |
          docker run -d --name minio -u 0 -p 9000:9000 \
            -e MINIO_ROOT_USER=mobilio -e MINIO_ROOT_PASSWORD=mobilio_minio_pw \
            cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880 \
            server /data --console-address ":9001"
          timeout 60 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: Create MinIO bucket
        run: npm run ensure-bucket --workspace=@mobilio/storage

      - run: npm run lint

      - run: npm run typecheck

      - name: Run database migrations
        working-directory: packages/db
        run: npm run db:migrate

      - run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/config/coverage
            apps/web/coverage
            apps/api/coverage
            apps/worker/coverage
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobilio
          POSTGRES_PASSWORD: mobilio
          POSTGRES_DB: mobilio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # No minio service here — see the build job's "Start MinIO" step comment for why.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Start MinIO
        run: |
          docker run -d --name minio -u 0 -p 9000:9000 \
            -e MINIO_ROOT_USER=mobilio -e MINIO_ROOT_PASSWORD=mobilio_minio_pw \
            cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880 \
            server /data --console-address ":9001"
          timeout 60 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: Create MinIO bucket
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: mobilio
          S3_ACCESS_KEY_ID: mobilio
          S3_SECRET_ACCESS_KEY: mobilio_minio_pw
        run: npm run ensure-bucket --workspace=@mobilio/storage

      - name: Run database migrations
        working-directory: packages/db
        env:
          POSTGRES_BOOTSTRAP_URL: postgres://mobilio:mobilio@localhost:5432/mobilio
          MOBILIO_MIGRATOR_PASSWORD: mobilio_migrator_pw
          MOBILIO_APP_PASSWORD: mobilio_app_pw
          MIGRATOR_DATABASE_URL: postgres://mobilio_migrator:mobilio_migrator_pw@localhost:5432/mobilio
        run: npm run db:migrate

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web
        env:
          # auth.spec.ts's webServer starts a real apps/api against these — default
          # ports match this job's services: containers (CI's native 5432/6379, not
          # local dev's remapped 5433/6380 — see root .env.example for why those differ).
          E2E_API_DATABASE_URL: postgres://mobilio_app:mobilio_app_pw@localhost:5432/mobilio
          E2E_API_REDIS_URL: redis://localhost:6379
          E2E_API_S3_ENDPOINT: http://localhost:9000
          E2E_API_S3_PUBLIC_ENDPOINT: http://localhost:9000
          E2E_API_S3_BUCKET: mobilio
          E2E_API_S3_ACCESS_KEY_ID: mobilio
          E2E_API_S3_SECRET_ACCESS_KEY: mobilio_minio_pw
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
