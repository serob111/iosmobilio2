name: ci
# Verified on a real PR: build job + e2e job (PR-to-main only) both pass. See PR history.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobilio
          POSTGRES_PASSWORD: mobilio
          POSTGRES_DB: mobilio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # mobilio_app role, not the services: superuser — matches what apps/api actually
      # connects as (see packages/db/sql/0000_bootstrap_roles.sql). Created by the
      # "Run database migrations" step below, which also needs the superuser/migrator
      # URLs — those stay step-local since nothing else needs them.
      DATABASE_URL: postgres://mobilio_app:mobilio_app_pw@localhost:5432/mobilio
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Run database migrations
        working-directory: packages/db
        env:
          POSTGRES_BOOTSTRAP_URL: postgres://mobilio:mobilio@localhost:5432/mobilio
          MOBILIO_MIGRATOR_PASSWORD: mobilio_migrator_pw
          MOBILIO_APP_PASSWORD: mobilio_app_pw
          MIGRATOR_DATABASE_URL: postgres://mobilio_migrator:mobilio_migrator_pw@localhost:5432/mobilio
        run: npm run db:migrate

      - run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/config/coverage
            apps/web/coverage
            apps/api/coverage
            apps/worker/coverage
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    needs: build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
