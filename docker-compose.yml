services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mobilio
      POSTGRES_PASSWORD: mobilio
      POSTGRES_DB: mobilio
    ports:
      # Host port defaults to 5433, not 5432 — this machine also runs a native (non-Docker)
      # Postgres 18 Windows service bound to 5432, which silently intercepted host connections
      # meant for this container. Internal container-to-container traffic (api ->
      # postgres:5432) is unaffected. Override via POSTGRES_HOST_PORT in a root .env.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mobilio']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # Host port defaults to 6380, not 6379 — other projects on this machine already bind
      # 6379. Internal container-to-container traffic (api/worker -> redis:6379) is
      # unaffected. Override via REDIS_HOST_PORT in a root .env.
      - '${REDIS_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # cgr.dev/chainguard/minio, not Docker Hub's minio/minio or bitnami/minio — both of
  # those now require registry auth to pull at all (MinIO Inc. and Bitnami locked their
  # free images behind login in 2025); Chainguard's build is still anonymously pullable.
  # It runs as a non-root user by default, which can't write to /data unless the
  # container itself runs as root — hence `user: "0"` below (dev-only infra, not a prod
  # concern). There's no accompanying `mc` client image left either (Chainguard's is
  # gated, MinIO's and Bitnami's aren't pullable) — see the createbucket service, which
  # creates the bucket via the AWS SDK directly instead.
  #
  # Pinned by digest, not `:latest` — Chainguard rebuilds `:latest` frequently (it's a
  # rolling tag), so an unpinned reference here would make `docker compose up` silently
  # pull a different image every so often. The trade-off is this digest needs a manual
  # bump to pick up new patches; ci.yml uses the same digest for the same reason.
  minio:
    image: cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
    user: '0'
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: mobilio
      MINIO_ROOT_PASSWORD: mobilio_minio_pw
    ports:
      # Same story as postgres/redis above — overridable in case of a local port clash.
      - '${MINIO_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # No curl/wget in this image (Chainguard's minio is extremely minimal — see the
      # comment above) — a bare TCP connect via bash's /dev/tcp is enough to know the
      # server is accepting connections, which is all this gate needs.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the "mobilio" bucket if it doesn't exist yet, via packages/storage's
  # ensure-bucket script (plain @aws-sdk/client-s3, no mc/aws-cli container needed).
  createbucket:
    build:
      context: .
      dockerfile: packages/storage/Dockerfile
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mobilio
      S3_ACCESS_KEY_ID: mobilio
      S3_SECRET_ACCESS_KEY: mobilio_minio_pw
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      minio:
        condition: service_healthy

  # One-shot: bootstraps the mobilio_migrator/mobilio_app roles (if missing) and runs
  # Drizzle migrations (tables + RLS policies). api/worker wait for this to finish
  # successfully before starting, since the mobilio_app role they connect as doesn't
  # exist until this has run at least once.
  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      POSTGRES_BOOTSTRAP_URL: postgres://mobilio:mobilio@postgres:5432/mobilio
      MOBILIO_MIGRATOR_PASSWORD: mobilio_migrator_pw
      MOBILIO_APP_PASSWORD: mobilio_app_pw
      MIGRATOR_DATABASE_URL: postgres://mobilio_migrator:mobilio_migrator_pw@postgres:5432/mobilio
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://mobilio_app:mobilio_app_pw@postgres:5432/mobilio
      REDIS_URL: redis://redis:6379
      PORT: 3000
      # S3_ENDPOINT (internal, container-to-container) is not reachable from a browser —
      # S3_PUBLIC_ENDPOINT is what signed URLs actually point at. Defaults to
      # MINIO_HOST_PORT's mapping; override if that's been changed in a root .env.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: 'http://localhost:${MINIO_HOST_PORT:-9000}'
      S3_BUCKET: mobilio
      S3_ACCESS_KEY_ID: mobilio
      S3_SECRET_ACCESS_KEY: mobilio_minio_pw
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://mobilio_app:mobilio_app_pw@postgres:5432/mobilio
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mobilio
      S3_ACCESS_KEY_ID: mobilio
      S3_SECRET_ACCESS_KEY: mobilio_minio_pw
      S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
